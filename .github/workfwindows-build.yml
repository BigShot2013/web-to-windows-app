name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run desktop:build

      - uses: actions/upload-artifact@v4
        with:
          name: BSOD_defense-windows
          path: release/*.zip
